name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugin-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.22.3"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Check generated plugin drift
        run: bun run sync:plugin -- --check
      # The isolated artifact tests check an offline install, so warm the npm dependency cache first.
      - name: Prepare npm cache for offline artifact tests
        run: |
          artifact_cache_seed="$(mktemp -d)"
          trap 'rm -rf "$artifact_cache_seed"' EXIT
          npm install --prefix "$artifact_cache_seed" --ignore-scripts --no-audit --no-fund typescript@7.0.2
      # The Python parser must be present in CI: a missing parser fails instead of skipping.
      - run: bun run check
        env:
          BOXBOX_REQUIRE_PARSERS: "1"
