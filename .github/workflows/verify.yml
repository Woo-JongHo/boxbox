name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  plugin-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.3"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      # kotlinc for the Kotlin parse gate; a plain zip download keeps the workflow dependency-free.
      - run: |
          curl -sL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          sudo unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      # The isolated artifact tests check an offline install, so warm the npm dependency cache first.
      - name: Prepare npm cache for offline artifact tests
        run: |
          artifact_cache_seed="$(mktemp -d)"
          trap 'rm -rf "$artifact_cache_seed"' EXIT
          npm install --prefix "$artifact_cache_seed" --ignore-scripts --no-audit --no-fund typescript@7.0.2
      # Every language parser must be present in CI: a missing parser fails instead of skipping.
      - run: bun run check
        env:
          BOXBOX_REQUIRE_PARSERS: "1"
