name: release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.candidate.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.22.3"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Build installer archive once
        run: bun run pack:installer
      - name: Require a clean source checkout after packaging
        run: |
          if test -n "$(git status --porcelain)"; then
            git status --short
            exit 1
          fi
      - name: Record the exact archive and source identity
        id: candidate
        run: bun development/tools/release-candidate.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boxbox-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release-candidate/
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.22.3"
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify required parser command
        run: python3 --version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: boxbox-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release-candidate/
      - name: Verify digest and exercise the downloaded archive
        env:
          CANDIDATE_SHA256: ${{ needs.package.outputs.sha256 }}
        run: node development/tools/release-smoke.mjs dist/release-candidate
      - name: Preserve native smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boxbox-smoke-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release-candidate/smoke-${{ runner.os }}.json
          if-no-files-found: warn
          retention-days: 14
