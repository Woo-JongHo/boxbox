name: Feature request
description: Propose a feature or behavior change
body:
  - type: textarea
    id: feature
    attributes:
      label: What would you like to be added?
      description: Describe the user task, current behavior, and a small synthetic example. Include the affected language, command, host, or installation path.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why is this needed?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and counterexamples
      description: Specify what must pass and which cases must remain unchanged or refused. New formatting rules need separate human approval; use the rule proposal template for those.
    validations:
      required: true
